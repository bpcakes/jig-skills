name: Jig Review Tests

on:
  pull_request:
    paths:
      - "plugins/jig-review/**"
      - "plugins/*/skills/**"
      - "scripts/install.sh"
      - "evals/**"
      - ".github/workflows/jig-review-tests.yml"
  push:
    paths:
      - "plugins/jig-review/**"
      - "plugins/*/skills/**"
      - "scripts/install.sh"
      - "evals/**"
      - ".github/workflows/jig-review-tests.yml"

permissions:
  contents: read

jobs:
  node-tests:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test plugins/jig-review/tests/*.test.mjs
      - run: node --test evals/*.test.mjs
      - run: python3 plugins/jig-exec-plans/skills/cursor-implement-exec-plan/scripts/test_run_cursor_execplan.py

[package]
name = "rust-dup-unifier"
version = "3.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
ra_ap_syntax = "=0.0.349"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
blake3 = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
